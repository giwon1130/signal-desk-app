<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="시데(Signal Desk)는 2026년 10월 24일 서비스 운영을 종료했습니다.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>서비스 종료 안내 · 시데</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; color: #20362f; background: #f3f6f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    main { width: 100%; max-width: 640px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 38px; font-size: 19px; font-weight: 700; letter-spacing: -.5px; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #174c3e; color: white; font-size: 23px; }
    article { background: white; border: 1px solid #dfe7e2; border-radius: 24px; padding: 40px; }
    .status { display: inline-block; border-radius: 6px; padding: 6px 9px; background: #edf3ef; color: #426354; font-size: 12px; font-weight: 600; }
    h1 { margin: 22px 0; font-size: clamp(27px, 5vw, 36px); line-height: 1.45; letter-spacing: -1.5px; word-break: keep-all; }
    p { margin: 14px 0; color: #57695f; line-height: 1.85; font-size: 15px; word-break: keep-all; }
    strong { color: #20362f; }
    .thanks { margin-top: 26px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 22px; margin-top: 30px; padding-top: 24px; border-top: 1px solid #e6ece8; }
    a { color: #174c3e; text-underline-offset: 4px; font-size: 14px; line-height: 1.7; }
    a:focus-visible { outline: 3px solid #5a9f7e; outline-offset: 5px; }
    footer { padding: 22px 4px; color: #6f7f75; font-size: 12px; line-height: 1.8; }
    footer a { font-size: 12px; }
    @media (max-width: 480px) { article { padding: 28px 24px; border-radius: 18px; } .brand { margin-bottom: 26px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">S</span><span>시데 <span lang="en">Signal Desk</span></span></div>
    <article>
      <span class="status">서비스 종료 · 2026.10.24</span>
      <h1>시데 서비스가<br>종료되었습니다.</h1>
      <p><strong>2026년 10월 24일부로 서비스 운영을 종료했습니다.</strong><br>App Store 신규 다운로드와 온라인 서비스 제공을 중단했습니다.</p>
      <p>기존에 설치한 앱에서도 시황·시세 조회, 로그인, 브리프·서버 알림 등 온라인 기능을 이용하실 수 없습니다.</p>
      <p class="thanks">그동안 시데를 이용해 주셔서 감사합니다.<br>프로젝트 소스와 개발 기록은 GitHub에 보관합니다.</p>
      <nav aria-label="관련 안내">
        <a href="https://github.com/giwon1130/signal-desk-app">소스·개발 기록</a>
        <a href="./privacy.html">개인정보처리방침</a>
      </nav>
    </article>
    <footer>개인정보 관련 문의 · <a href="mailto:gwim113000@gmail.com">gwim113000@gmail.com</a></footer>
  </main>
</body>
</html>
