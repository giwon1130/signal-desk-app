name: Publish service closure notice

# 서비스 종료 후에는 API를 호출하지 않는 정적 안내만 게시한다.
# Expo 앱, 백엔드, iOS 빌드·제출을 실행하지 않는다.

on:
  push:
    branches: [main]
    paths:
      - 'docs/service-ended.html'
      - 'public/privacy.html'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 — 진행 중이면 최신으로 대체.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static closure notice
        run: |
          mkdir -p dist
          cp docs/service-ended.html dist/index.html
          cp public/privacy.html dist/privacy.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
